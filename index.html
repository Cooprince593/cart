<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Prince</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Cooprince593/cart/main/icons/white-flower.png" />
  
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @font-face {
      font-family: 'Demonized Font';
      src: url('https://raw.githubusercontent.com/Cooprince593/cart/main/Demonized.ttf') format('truetype'), 
           url('Demonized.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    body, button, a, p, div {
      font-family: 'Demonized Font', system-ui, sans-serif !important;
    }

    body {
      overflow: hidden;
      background: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ── Fondo de Video Sin Lag ── */
    #bg-video {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
      pointer-events: none;
    }

    #video-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      z-index: -1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease-in-out;
    }

    body.is-blurred #video-overlay {
      opacity: 1;
    }

    /* ── PANTALLA DE BIENVENIDA ── */
    #welcome-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.6s;
      cursor: pointer;
    }
    
    #welcome-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #welcome-rose-loading {
      width: 90px;
      height: 90px;
      object-fit: contain;
      animation: pulseRose 2s infinite ease-in-out;
    }

    /* ── Decoraciones ── */
    .rose-corner {
      position: fixed;
      width: 220px;
      opacity: 0.07;
      pointer-events: none;
      z-index: 2;
    }
    .rose-tl { top: -40px; right: -40px; transform: rotate(15deg); }
    .rose-br { bottom: -40px; left: -40px; transform: rotate(200deg); }

    /* ── Contenedor Central ── */
    #center {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(18px) scale(0.98);
      transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: none;
    }

    #center.card-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    #card-wrap {
      animation: float 7s ease-in-out infinite, fadeInUp 0.85s cubic-bezier(.16,1,.3,1) both;
      perspective: 1200px;
      width: min(92vw, 620px); 
      position: relative;
    }

    /* ── Tarjeta (SIN BLUR PARA EVITAR LAG) ── */
    #card {
      border-radius: 24px;
      background: rgba(15, 15, 15, 0.9); /* Fondo oscuro liso */
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 24px 60px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      padding: 38px 30px; 
      min-height: 290px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 28px;
      overflow: hidden;
      position: relative;
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform 0.2s ease-out;
    }

    @media (max-width: 600px) {
      #card { flex-direction: column; padding: 36px 22px; gap: 20px; }
      .card-left { width: 100%; justify-content: center; }
      .card-right { padding-left: 0 !important; width: 100%; }
    }

    .card-rose { position: absolute; width: 120px; opacity: 0.15; pointer-events: none; }
    .card-rose-tl { top: -18px; left: -22px; transform: rotate(-20deg); }
    .card-rose-br { bottom: -18px; right: -22px; transform: rotate(160deg); }

    /* ── Columna Izquierda: Avatar y Nombre ── */
    .card-left {
      display: flex; flex-direction: row; align-items: center; justify-content: center;
      position: relative; z-index: 1; min-width: 240px;
    }

    #avatar-column { display: flex; flex-direction: row; align-items: center; gap: 24px; width: 100%; justify-content: center; }
    
    #profile-info { display: flex; flex-direction: column; justify-content: center; align-items: center; }

    #profile-name {
      margin: 0;
      color: rgba(255,255,255,0.95);
      font-size: 32px;
      font-weight: 400;
      letter-spacing: 0.02em;
      white-space: nowrap;
      text-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    /* ── Columna Derecha: Redes y Música ── */
    .card-right {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      flex: 1; min-width: 0; position: relative; z-index: 1; padding-left: 14px; padding-right: 4px; padding-top: 4px;
    }

    .card-right::before {
      content: ''; position: absolute; top: 12%; bottom: 12%; left: 0px; width: 1px;
      border-radius: 999px; background: linear-gradient(180deg, transparent, rgba(255,255,255,0.25), transparent);
    }

    /* Flor central encima de las conexiones */
    .center-flower {
      width: 32px;
      height: 32px;
      object-fit: contain;
      margin-bottom: 16px;
      filter: drop-shadow(0 0 6px rgba(255,255,255,0.3));
      animation: spin-slow 10s linear infinite;
    }

    #connections-row {
      display: flex; justify-content: center; flex-wrap: nowrap; gap: 16px;
      width: 100%; max-width: 320px; margin-bottom: 14px;
    }

    .connection-box {
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; min-width: 40px; min-height: 40px; aspect-ratio: 1 / 1;
      padding: 0; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px; color: rgba(255, 255, 255, 0.92); transition: transform 0.2s ease, background 0.2s ease;
      text-decoration: none; position: relative; box-shadow: 0 8px 18px rgba(0,0,0,0.18); cursor: pointer;
    }
    .connection-box:hover { background: rgba(255, 255, 255, 0.08); color: #fff; transform: translateY(-3px); }
    .connection-box img { width: 20px; height: 20px; object-fit: contain; }

    .connection-box::after {
      content: attr(data-tooltip); position: absolute; top: -32px; left: 50%;
      transform: translateX(-50%) scale(0.95); color: #fff; background: rgba(0,0,0,0.75);
      padding: 5px 10px; border-radius: 999px; font-size: 11px; opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease; z-index: 10; font-family: 'Demonized Font', system-ui, sans-serif !important;
    }
    .connection-box:hover::after { opacity: 1; transform: translateX(-50%) scale(1); }

    .music-control-panel { width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center; margin-top: 14px; }
    .music-button-row { display: flex; justify-content: center; gap: 14px; width: 100%; }

    .music-action {
      width: 46px; height: 46px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08); color: #fff; display: inline-flex; align-items: center;
      justify-content: center; cursor: pointer; transition: transform 0.18s ease, background 0.18s ease;
    }
    .music-action:hover { transform: translateY(-2px); background: rgba(255,255,255,0.14); }
    .music-action svg { width: 20px; height: 20px; color: currentColor; }

    #track-progress {
      width: 100%; max-width: 320px; appearance: none; background: rgba(255,255,255,0.1);
      height: 6px; border-radius: 999px; outline: none;
    }
    #track-progress::-webkit-slider-thumb {
      appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; cursor: pointer;
    }

    /* ── Efecto del Avatar (Borde Sólido + Pulso) ── */
    #avatar-wrap { 
      position: relative; 
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #avatar-img { 
      width: 100%; 
      height: 100%; 
      border-radius: 50%; 
      position: relative; 
      z-index: 2; 
      object-fit: cover; 
      display: block;
      border: 3px solid rgba(255, 255, 255, 0.85);
      animation: avatarPulse 2.5s infinite ease-in-out;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    #avatar-wrap:hover #avatar-img {
      transform: scale(1.08) rotate(3deg);
    }

    #online-dot { 
      position: absolute; 
      bottom: 2px; right: 2px; 
      width: 24px; height: 24px; 
      border-radius: 50%; 
      background: #23a559; 
      border: 3px solid #080808; 
      z-index: 3; 
    }

    /* ── Control de Música Superior (SIN BLUR) ── */
    #music-container {
      position: fixed; top: 24px; left: 24px; display: flex; align-items: center;
      background: rgba(15, 15, 15, 0.9); border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px; padding: 6px; z-index: 100;
    }
    #music-toggle { 
      background: transparent; border: none; color: #fff; width: 34px; height: 34px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; padding: 0;
    }
    #music-toggle svg { width: 18px; height: 18px; display: block; }
    #volume-slider { width: 0; opacity: 0; appearance: none; height: 4px; background: rgba(255, 255, 255, 0.2); transition: all 0.3s ease; }
    #music-container:hover #volume-slider { width: 85px; opacity: 1; margin-left: 10px; margin-right: 6px; pointer-events: auto; }
    #volume-slider::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; }

    /* Keyframes */
    @keyframes spin-slow { 
      from { transform: rotate(0deg); } 
      to { transform: rotate(360deg); } 
    }
    @keyframes avatarPulse {
      0% { box-shadow: 0 0 10px rgba(255, 255, 255, 0.2); }
      50% { box-shadow: 0 0 25px rgba(255, 255, 255, 0.6); }
      100% { box-shadow: 0 0 10px rgba(255, 255, 255, 0.2); }
    }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes pulseRose { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.08); opacity: 0.95; } }
  </style>
</head>
<body>

  <video id="bg-video" loop playsinline>
    <source src="https://raw.githubusercontent.com/Cooprince593/cart/main/wtf.mp4" type="video/mp4">
  </video>
  
  <div id="video-overlay"></div>

  <div id="welcome-overlay">
    <img id="welcome-rose-loading" src="https://raw.githubusercontent.com/Cooprince593/cart/main/icons/white-flower.png" alt="Cargando..." />
  </div>

  <audio id="bg-music"></audio>

  <div id="music-container">
    <button id="music-toggle" aria-label="Reproducir música">
      <i data-lucide="volume-x" id="icon-muted" style="display: none;"></i>
      <i data-lucide="volume-2" id="icon-playing"></i>
    </button>
    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" aria-label="Control de volumen">
  </div>

  <img class="rose-corner rose-tl" src="https://media.discordapp.net/attachments/1502878615841406986/1508989850232160357/rose.png" alt="" />
  <img class="rose-corner rose-br" src="https://media.discordapp.net/attachments/1502878615841406986/1508989850232160357/rose.png" alt="" />

  <div id="center">
    <div id="card-wrap">
      <div id="card">
        
        <img class="card-rose card-rose-tl" src="https://media.discordapp.net/attachments/1502878615841406986/1508989850232160357/rose.png" alt="" />
        <img class="card-rose card-rose-br" src="https://media.discordapp.net/attachments/1502878615841406986/1508989850232160357/rose.png" alt="" />

        <div class="card-left">
          <div id="avatar-column">
            <div id="avatar-wrap">
              <img id="avatar-img" src="bruh.png" alt="Perfil" />
              <div id="online-dot"></div>
            </div>
            
            <div id="profile-info">
              <p id="profile-name">Prince</p>
            </div>
          </div>
        </div>

        <div class="card-right">
          
          <img class="center-flower" src="https://raw.githubusercontent.com/Cooprince593/cart/main/icons/white-flower.png" alt="Flor Decorativa">

          <div id="connections-row">
            <a class="connection-box" href="https://discord.com/users/1501775899971031190" target="_blank" data-tooltip="Discord">
              <img src="https://raw.githubusercontent.com/Cooprince593/cart/main/icons/Discord.png" alt="Discord">
            </a>
            <a class="connection-box" href="https://www.roblox.com/es/users/275936594/profile" target="_blank" data-tooltip="Roblox">
              <img src="https://raw.githubusercontent.com/Cooprince593/cart/main/icons/Roblox.png" alt="Roblox">
            </a>
            <a class="connection-box" href="https://steamcommunity.com/profiles/76561199447485191/" target="_blank" data-tooltip="Steam">
              <img src="https://raw.githubusercontent.com/Cooprince593/cart/main/icons/Steam.png" alt="Steam">
            </a>
          </div>
          
          <div class="music-control-panel">
            <div class="music-button-row">
              <button class="music-action" id="music-prev">
                <i data-lucide="skip-back"></i>
              </button>
              <button class="music-action" id="music-playpause">
                <i data-lucide="play" id="icon-play"></i>
                <i data-lucide="pause" id="icon-pause" style="display: none;"></i>
              </button>
              <button class="music-action" id="music-next">
                <i data-lucide="skip-forward"></i>
              </button>
            </div>
            <input type="range" id="track-progress" min="0" max="100" value="0">
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    (function () {
      const bgMusic = document.getElementById('bg-music');
      const bgVideo = document.getElementById('bg-video'); 
      const musicBtn = document.getElementById('music-toggle');
      const volumeSlider = document.getElementById('volume-slider');
      
      const iconMuted = document.getElementById('icon-muted');
      const iconPlaying = document.getElementById('icon-playing');
      const iconPlay = document.getElementById('icon-play');
      const iconPause = document.getElementById('icon-pause');
      
      const welcomeOverlay = document.getElementById('welcome-overlay');

      let currentPlaylist = [];
      let currentTrackIndex = 0; 

      fetch('https://api.github.com/repos/Cooprince593/cart/contents/music')
        .then(response => response.json())
        .then(data => {
          if(Array.isArray(data)) {
            currentPlaylist = data.filter(file => file.name.endsWith('.mp3'));
            if (currentPlaylist.length > 0) {
              currentTrackIndex = Math.floor(Math.random() * currentPlaylist.length);
              bgMusic.src = currentPlaylist[currentTrackIndex].download_url;
              bgMusic.load(); 
            }
          }
        })
        .catch(err => console.error("Error conectando con la carpeta de música:", err));

      bgMusic.volume = volumeSlider.value;

      function updateIcons() {
        if (!bgMusic.paused && bgMusic.volume > 0) {
          if(iconMuted) iconMuted.style.display = 'none';
          if(iconPlaying) iconPlaying.style.display = 'block';
        } else {
          if(iconMuted) iconMuted.style.display = 'block';
          if(iconPlaying) iconPlaying.style.display = 'none';
        }
      }

      function refreshMusicButton() {
        if (bgMusic.paused) {
          if(iconPlay) iconPlay.style.display = 'block';
          if(iconPause) iconPause.style.display = 'none';
        } else {
          if(iconPlay) iconPlay.style.display = 'none';
          if(iconPause) iconPause.style.display = 'block';
        }
      }

      function playSpecificTrack(index) {
        if (currentPlaylist.length === 0) return;
        currentTrackIndex = index;
        
        bgMusic.src = currentPlaylist[currentTrackIndex].download_url;
        bgMusic.currentTime = 0;
        bgMusic.load(); 
        
        const playPromise = bgMusic.play();
        if (playPromise !== undefined) {
          playPromise.catch(err => console.log("La reproducción falló: ", err));
        }
      }

      function playNextTrack() {
        if (currentPlaylist.length === 0) return;
        const nextIndex = (currentTrackIndex + 1) % currentPlaylist.length; 
        playSpecificTrack(nextIndex);
      }

      function playPrevTrack() {
        if (currentPlaylist.length === 0) return;
        const prevIndex = (currentTrackIndex - 1 + currentPlaylist.length) % currentPlaylist.length; 
        playSpecificTrack(prevIndex);
      }

      bgMusic.addEventListener('play', () => { updateIcons(); refreshMusicButton(); });
      bgMusic.addEventListener('pause', () => { updateIcons(); refreshMusicButton(); });
      bgMusic.addEventListener('volumechange', updateIcons);
      
      bgMusic.addEventListener('error', () => {
         console.warn("Se detectó un error en el audio. Pasando a la siguiente pista automáticamente...");
         setTimeout(() => playNextTrack(), 500);
      });

      welcomeOverlay.addEventListener('click', () => {
        document.body.classList.add('is-blurred');
        
        if (bgVideo) {
          bgVideo.play().catch(err => console.log("Video no pudo reproducirse automáticamente:", err));
        }

        const playPromise = bgMusic.play();
        if (playPromise !== undefined) {
            playPromise.catch(err => console.log("Música bloqueada:", err));
        }
        
        welcomeOverlay.classList.add('fade-out');
        
        setTimeout(() => {
          document.getElementById('center').classList.add('card-visible');
        }, 650);
      });

      musicBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!bgMusic.paused) bgMusic.pause();
        else bgMusic.play().catch(err => console.log(err));
      });

      volumeSlider.addEventListener('input', (e) => {
        bgMusic.volume = parseFloat(e.target.value);
      });

      const trackProgress = document.getElementById('track-progress');
      const musicPlayPause = document.getElementById('music-playpause');
      const musicNext = document.getElementById('music-next');
      const musicPrev = document.getElementById('music-prev');

      if (bgMusic) {
        bgMusic.addEventListener('timeupdate', () => {
          if (!bgMusic.duration) return;
          trackProgress.value = Math.round((bgMusic.currentTime / bgMusic.duration) * 100);
        });
        
        bgMusic.addEventListener('ended', () => {
           playNextTrack();
        });
      }

      if (trackProgress) {
        trackProgress.addEventListener('input', (e) => {
          if (!bgMusic.duration) return;
          bgMusic.currentTime = (parseFloat(e.target.value) / 100) * bgMusic.duration;
        });
      }

      if (musicPlayPause) {
        musicPlayPause.addEventListener('click', () => {
          if (bgMusic.paused) bgMusic.play().catch(err => console.log(err));
          else bgMusic.pause();
        });
      }

      if (musicNext) {
        musicNext.addEventListener('click', () => {
          playNextTrack();
        });
      }

      if (musicPrev) {
        musicPrev.addEventListener('click', () => {
          if (bgMusic.currentTime > 3) {
            bgMusic.currentTime = 0;
            bgMusic.play().catch(e => console.log(e));
          } else {
            playPrevTrack();
          }
        });
      }

    })();

    (function () {
      const wrap = document.getElementById('card-wrap');
      const card = document.getElementById('card');
      const MAX  = 12;
      let raf;
      let lastTime = 0;

      wrap.addEventListener('mousemove', e => {
        const now = performance.now();
        if (now - lastTime < 16) return;
        lastTime = now;

        const rect = wrap.getBoundingClientRect();
        const rx = (-(e.clientY - (rect.top + rect.height / 2)) / (rect.height / 2)) * MAX;
        const ry = ((e.clientX - (rect.left + rect.width / 2)) / (rect.width / 2)) * MAX;
        
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => {
          card.style.transform  = `rotateX(${rx}deg) rotateY(${ry}deg) scale(1.03)`;
        });
      });

      wrap.addEventListener('mouseleave', () => {
        cancelAnimationFrame(raf);
        card.style.transform  = 'rotateX(0deg) rotateY(0deg) scale(1)';
      });
    })();
  </script>
</body>
</html>
